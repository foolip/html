name: Build
on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    # The R2 credentials are secrets of the production environment, which only
    # the main branch can use. PR builds run without an environment.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || '' }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
        path: 'source'
    - name: Build
      run: |
        mkdir output
        docker run --mount "type=bind,source=$GITHUB_WORKSPACE/source,destination=/whatwg/html,readonly=1" \
                   --env "HTML_SOURCE=/whatwg/html" \
                   --mount "type=bind,source=$GITHUB_WORKSPACE/output,destination=/whatwg/output" \
                   --env "HTML_OUTPUT=/whatwg/output" \
                   ghcr.io/whatwg/html-build
    - name: Deploy
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      env:
        SERVER: ${{ secrets.MARQUEE_SERVER }}
        SERVER_PUBLIC_KEY: ${{ secrets.MARQUEE_PUBLIC_KEY }}
        SERVER_DEPLOY_KEY: ${{ secrets.MARQUEE_DEPLOY_KEY }}
      run: |
        eval "$(ssh-agent -s)"
        echo "$SERVER_DEPLOY_KEY" | ssh-add -
        mkdir -p ~/.ssh/ && echo "$SERVER $SERVER_PUBLIC_KEY" > ~/.ssh/known_hosts

        # Sync, including deletes, but ignoring the stuff we'll deploy below, so that we don't delete them.
        # --chmod=D755,F644 means read-write for user, read-only for others.
        echo "Deploying build output..."
        rsync --archive --chmod=D755,F644 --compress --verbose \
              --delete --exclude="commit-snapshots" --exclude="review-drafts" \
              "$GITHUB_WORKSPACE/output/" "deploy@$SERVER:/var/www/html.spec.whatwg.org"

        echo ""
        echo "Deploying Commit Snapshot and Review Drafts, if any..."
        rsync --archive --chmod=D755,F644 --compress --verbose \
              "$GITHUB_WORKSPACE/output/commit-snapshots" "$GITHUB_WORKSPACE/output/review-drafts" "deploy@$SERVER:/var/www/html.spec.whatwg.org"
    # Also upload to the Cloudflare R2 bucket, if the R2 credentials are set.
    # See https://github.com/whatwg/misc-server/issues/107.
    - name: Upload to R2
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
      working-directory: output
      run: |
        if [[ -z "$AWS_ACCESS_KEY_ID" ]]; then
          echo "Skipping R2 upload (no credentials)"
          exit 0
        fi
        DEST="s3://whatwg-sites/html.spec.whatwg.org"

        # Like the first rsync above: with deletes, but not touching commit snapshots and review drafts.
        echo "Uploading build output..."
        aws s3 sync --delete . "$DEST/" --exclude "commit-snapshots/*" --exclude "review-drafts/*"

        # Commit snapshots and review drafts are write-once in R2 (bucket lock), so upload each one only
        # if it isn't there yet, e.g. when a deploy is re-run.
        echo ""
        echo "Uploading Commit Snapshot and Review Drafts, if any..."
        for ENTRY in commit-snapshots/* review-drafts/*; do
          [[ -e "$ENTRY" ]] || continue
          KEY="$ENTRY"
          [[ -d "$ENTRY" ]] && KEY="$ENTRY/"
          if [[ -n "$(aws s3 ls "$DEST/$KEY" || true)" ]]; then
            echo "$ENTRY is already in R2, skipping"
          elif [[ -d "$ENTRY" ]]; then
            aws s3 sync "$ENTRY/" "$DEST/$ENTRY/"
          else
            aws s3 cp "$ENTRY" "$DEST/$ENTRY"
          fi
        done
